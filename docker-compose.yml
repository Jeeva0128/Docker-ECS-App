services:
  taskflowapi:
    build: ./backend
    container_name: taskflowapi
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3000"
    networks:
      - taskflow-network

  nginx:
    image: nginx:alpine
    container_name: taskflow-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - taskflowapi
    networks:
      - taskflow-network

networks:
  taskflow-network:
    driver: bridge
